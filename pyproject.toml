[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multitenant-config"
version = "0.1.0"
description = "Multi-tenant Config & Feature Flags for B2B SaaS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["feature-flags", "multi-tenant", "saas", "config", "rollout", "ab-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/your-username/multitenant-config"
Repository = "https://github.com/your-username/multitenant-config"
Issues = "https://github.com/your-username/multitenant-config/issues"

[tool.hatch.build.targets.wheel]
packages = ["multitenant_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
